version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      terraform-deps:
        patterns: ["*"]
    ignore:
      # Major provider bumps (e.g. aws 5 -> 6) are breaking changes; do those
      # deliberately in a reviewed PR, not via an auto-mergeable dependabot PR.
      - dependency-name: "hashicorp/aws"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
