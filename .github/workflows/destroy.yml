name: 'Destroy'

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: 'Destroy'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
        aws-region: us-east-1
        role-session-name: GitHubActionsSyntheticCanaryDestroy

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: latest
        terraform_wrapper: false

    - name: Setup CUE
      env:
        CUE_VERSION: '0.13.0'
      run: |
        curl -sL "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /usr/local/bin cue

    # cloudwatch_map.auto.tfvars.json is CI-generated (gitignored) — destroy
    # needs it too, or terraform fails with "No value for required variable".
    - name: Generate cloudwatch_map from CUE
      run: cue export ./cue --out json > cloudwatch_map.auto.tfvars.json

    - name: Terraform Init
      run: terraform init

    - name: Terraform Destroy
      run: terraform destroy -auto-approve
