name: 'Deploy Synthetic Canaries'

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-oidc-role
        aws-region: us-east-1
        role-session-name: GitHubActionsSyntheticCanary

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: latest
        terraform_wrapper: false

    - name: Setup CUE
      env:
        CUE_VERSION: '0.13.0'
      run: |
        curl -sL "https://github.com/cue-lang/cue/releases/download/v${CUE_VERSION}/cue_v${CUE_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /usr/local/bin cue

    - name: Generate cloudwatch_map from CUE
      run: cue export ./cue --out json > cloudwatch_map.auto.tfvars.json

    # Repo stays public-safe: committed config uses placeholder emails; real
    # alarm recipients are injected here from repo secrets. Missing secrets
    # (e.g. a fork) fall back to the placeholders.
    - name: Inject alarm emails from secrets
      run: |
        python3 - <<'EOF'
        import json, os
        with open("cloudwatch_map.auto.tfvars.json") as f:
            data = json.load(f)
        primary = os.environ.get("SNS_EMAIL_PRIMARY", "")
        secondary = os.environ.get("SNS_EMAIL_SECONDARY", "")
        for c in data.get("cloudwatch_map", {}).values():
            email = c.get("sns_topic_email", "")
            if email == "alerts-primary@example.com" and primary:
                c["sns_topic_email"] = primary
            elif email == "alerts-secondary@example.com" and secondary:
                c["sns_topic_email"] = secondary
        with open("cloudwatch_map.auto.tfvars.json", "w") as f:
            json.dump(data, f)
        EOF
      env:
        SNS_EMAIL_PRIMARY: ${{ secrets.SNS_EMAIL_PRIMARY }}
        SNS_EMAIL_SECONDARY: ${{ secrets.SNS_EMAIL_SECONDARY }}

    - name: Terraform Init
      run: terraform init

    - name: Terraform Plan
      run: terraform plan

    - name: Terraform Apply
      run: terraform apply -auto-approve
